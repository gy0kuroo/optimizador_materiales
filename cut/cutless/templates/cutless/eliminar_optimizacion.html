{% extends 'cutless/base.html' %}
{% load static %}

{% block content %}
  <header class="page-header fade-in">
    <div class="page-header__text">
      <h1 class="page-title">Eliminar optimización</h1>
      <p class="page-lead">Confirma que deseas eliminar la optimización {{ optimizacion.etiqueta }}. Esta acción no se puede deshacer.</p>
    </div>
    <div class="page-header__actions">
      <a href="{% url 'cutless:historial' %}" class="btn btn-secondary" data-action="secondary" data-icon="chevron-left">Volver</a>
    </div>
  </header>

  <div class="card fade-in">
    <div class="card-header card-header-section card-header-section--danger">
      <h4 class="mb-0">Confirmar eliminación</h4>
    </div>
    <div class="card-body">
      <form method="post" data-tipo="optimizacion" data-confirm-delete="true">
        {% csrf_token %}
        <div class="form-action-bar">
          <a href="{% url 'cutless:historial' %}" class="btn btn-secondary" data-action="secondary" data-icon="chevron-left">Cancelar</a>
          <button type="submit" class="btn btn-danger" data-action="delete" data-icon="trash">Sí, eliminar optimización</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
