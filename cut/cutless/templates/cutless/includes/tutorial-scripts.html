{% load static %}
<script src="{% static 'cutless/js/tutorial.js' %}?v=2"></script>
    <!-- Sistema de Tutorial/Ayuda -->
    <script>
        // Detectar si es usuario nuevo
        const esUsuarioNuevo = {% if user.perfil.tutorial_completado %}false{% else %}true{% endif %};
        // Verificar si tiene optimizaciones (se pasará desde la vista)
        const tieneOptimizaciones = {% if tiene_optimizaciones %}true{% else %}false{% endif %};
        const mostrarModalBienvenida = {% if mostrar_modal_bienvenida %}true{% else %}false{% endif %};

        // Solo tras login exitoso (bandera en sesión), usuario nuevo y sin optimizaciones aún
        if (mostrarModalBienvenida && esUsuarioNuevo && !tieneOptimizaciones) {
            document.addEventListener('DOMContentLoaded', function() {
                const modalBienvenida = new bootstrap.Modal(document.getElementById('modalBienvenida'));
                modalBienvenida.show();
            });
        }

        // Función para iniciar tutorial interactivo
        function iniciarTutorial() {
            const pagina = '{{ request.resolver_match.url_name|escapejs }}';
            const secciones = {
                resultado: 'resultado',
                lista_materiales: 'materiales', lista_clientes: 'clientes',
                lista_proyectos: 'proyectos', lista_presupuestos: 'presupuestos',
                lista_plantillas: 'plantillas', historial_costos: 'costos',
                comparar_optimizaciones: 'comparar',
                agregar_optimizaciones_proyecto: 'agregar_optimizaciones',
                agregar_optimizaciones_presupuesto: 'agregar_optimizaciones'
            };
            if (pagina !== 'index') {
                return iniciarTutorialSeccion(secciones[pagina] || pagina);
            }
            return mostrarGuia(obtenerPasosTutorial(), marcarTutorialCompletado);
        }

        // Obtener pasos del tutorial según la página
        function obtenerPasosTutorial() {
            return [
                {
                    title: '¡Bienvenido a CutLess!',
                    intro: 'Este tutorial te guiará paso a paso para usar el sistema de optimización de cortes.',
                    element: document.querySelector('.app-main h1, .app-main h2')
                },
                {
                    title: 'Dimensiones del Tablero',
                    intro: 'Ingresa las dimensiones del tablero de madera que vas a cortar. Puedes usar diferentes unidades (cm, m, pulgadas, pies).',
                    element: document.querySelector('input[name="ancho"]') || document.querySelector('.form-control')
                },
                {
                    title: 'Agregar Piezas',
                    intro: 'Agrega las piezas que necesitas cortar. Puedes darle un nombre a cada pieza para identificarla mejor. Haz clic en "Añadir otro tipo de pieza" para añadir más.',
                    element: document.querySelector('textarea[name$="-nombre"]') || document.querySelector('.formset')
                },
                {
                    title: 'Generar plan de corte',
                    intro: 'Revisa las medidas y las cantidades antes de pulsar el botón principal para calcular el plan de corte.',
                    element: document.querySelector('#optimizacion-form button[type="submit"]')
                }
            ];
        }

        // Marcar tutorial como completado
        function marcarTutorialCompletado() {
            fetch('{% url "usuarios:completar_tutorial" %}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken'),
                    'Content-Type': 'application/json',
                },
                credentials: 'same-origin'
            }).then(response => response.json())
              .then(data => {
                  if (data.success) {
                      console.log('Tutorial marcado como completado');
                  }
              });
        }

        // Función auxiliar para obtener cookie CSRF
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Event listener para botón de tutorial
        document.addEventListener('DOMContentLoaded', function() {
            const btnTutorial = document.getElementById('btn-tutorial');
            if (btnTutorial) {
                btnTutorial.addEventListener('click', function(e) {
                    e.preventDefault();
                    iniciarTutorial();
                });
            }
        });
